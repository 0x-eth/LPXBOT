title = "LPBot Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Local-only placeholder credentials in the exact development template; these values are never deployment credentials."
condition = "AND"
paths = ['''^\.env\.example$''']
regexTarget = "match"
regexes = ['''(?i)(?:POSTGRES_PASSWORD|REDIS_PASSWORD|MINIO_ROOT_PASSWORD)=[a-z0-9_]*local_only''']

[[rules.allowlists]]
description = "Immutable P00-01 third-party client snapshot containing public Vite configuration literals; not an LPBot repository credential."
condition = "AND"
paths = ['''^artifacts/lpbot/2026-08-13/assets/vanilla-BG3-rOSy\.js$''']
regexTarget = "match"
regexes = ['''VITE_DEFAULT_(?:OKX_API_KEY|OKX_SECRET_KEY|WALLETCONNECT_PROJECT_ID):"[A-Za-z0-9.-]+"''']

[[rules.allowlists]]
description = "Immutable P00-01 third-party analytics bundle containing a public client project identifier; not an LPBot repository credential."
condition = "AND"
paths = ['''^artifacts/lpbot/2026-08-13/assets/(?:index-CALbxsQk|index-D0CkVZ_w)\.js$''']
regexTarget = "match"
regexes = ['''amplitudeApiKey:"[0-9a-f]{32}"''']

[[rules.allowlists]]
description = "Immutable P00-01 documentation examples use token1 for a public token symbol or token contract address, not an authentication token."
condition = "AND"
paths = ['''^artifacts/lpbot/2026-08-13/(?:api-calls\.json|api-docs\.json|api-docs\.md)$''']
regexTarget = "match"
regexes = [
  '''token1":\s*"[A-Z0-9._-]{1,32}"''',
  '''token1":\s*"0x[0-9a-fA-F]{40}"''',
]

[[rules.allowlists]]
description = "Immutable P00-01 third-party client snapshot assigns a public TokenType enum; it is not a credential."
condition = "AND"
paths = ['''^artifacts/lpbot/2026-08-13/assets/index-CL-zNRW4\.js$''']
regexTarget = "match"
regexes = ['''e\.TokenType=[A-Za-z_$][A-Za-z0-9_$]*''']

[[rules.allowlists]]
description = "P02-03 chain golden files record public ERC-20 token contract addresses, not authentication tokens."
condition = "AND"
paths = ['''^artifacts/acceptance/P02-03/golden/(?:raw|normalized)/(?:univ3|pcsv3|univ4|pcsv4)/[A-Za-z]+\.json$''']
regexTarget = "match"
regexes = ['''token[01]":\s*"0x[0-9a-f]{40}"''']

[[rules.allowlists]]
description = "P03-01 evaluator fixtures record deterministic SHA-256 candidate keys, not authentication credentials."
condition = "AND"
paths = ['''^artifacts/acceptance/P03-01/fixtures/(?:evaluation-cases|reorg-replacement)\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "P04-01 Argon2id known-answer fixture records a deterministic public derived-key output, not a credential."
condition = "AND"
paths = ['''^artifacts/acceptance/P04-01/fixtures/argon2id-known-answer\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "P04-05 wallet registry constants are public ERC-20 contract addresses, not authentication tokens."
condition = "AND"
paths = ['''^apps/api/src/wallet-assets\.ts$''']
regexTarget = "match"
regexes = ['''tokenAddress:\s*"0x[0-9a-f]{40}"''']

[[rules.allowlists]]
description = "P04-06 Anvil integration uses Anvil's documented account-zero development key on a loopback-only ephemeral chain."
condition = "AND"
paths = ['''^tests/integration/anvil-wallet-transfer\.integration\.ts$''']
regexTarget = "match"
regexes = ['''privateKey\s*=\s*"0xac0974''']

[[rules.allowlists]]
description = "P03-03 notification tests use these exact non-secret fixture values to verify write-only signing-key handling."
condition = "AND"
paths = ['''^tests/(?:notification-settings-api|notification-client)\.test\.ts$''']
regexTarget = "secret"
regexes = [
  '''^fixture-signing-key-material-000001$''',
  '''^replacement-signing-key-material-0002$''',
  '''^fixture-signing-secret-material-0001$''',
]

[[rules.allowlists]]
description = "P05-02 position scanner tests use this exact non-secret HMAC fixture value for cursor binding and tamper cases."
condition = "AND"
paths = ['''^tests/p05-position-scanner\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^p05-position-cursor-fixture-secret-at-least-32-bytes$''']

[[rules.allowlists]]
description = "P05-02 residual tests use these exact public idempotency fixture values; they are request identifiers, not credentials."
condition = "AND"
paths = ['''^tests/(?:p05-helper-residual-model|p05-helper-api)\.test\.ts$''']
regexTarget = "secret"
regexes = [
  '''^residual-fixture-001$''',
  '''^fixture-residual-00[12]$''',
]

[[rules.allowlists]]
description = "P05-03 quote and pricing tests use exact public BSC ERC-20 contract addresses, not authentication tokens."
condition = "AND"
paths = ['''^tests/(?:e2e/p05-03-swap-pricing\.spec\.ts|integration/postgres-pricing-position-store\.integration\.ts|p05-(?:pricing-position-(?:api|ledger|sse)|swap-(?:pricing-client|quote-adapter|quote-api))\.test\.ts)$''']
regexTarget = "secret"
regexes = [
  '''^0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c$''',
  '''^0x55d398326f99059ff775485246999027b3197955$''',
]
